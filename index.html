<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Little Ti9er 的個人網站</title>
    <style>
        :root {
            --bg-color: #f1f5f9;          /* 整體淡色背景 */
            --card-bg: #ffffff;           /* 卡片純白背景 */
            --text-main: #1e293b;         /* 主文字深色 */
            --text-muted: #64748b;        /* 次要文字灰色 */
            --accent-color: #0284c7;      /* 按鈕文字藍色 */
            --accent-hover: #0369a1;      /* 按鈕懸停深藍 */
            --btn-bg: #fefefe;            /* 按鈕預設淡底色 */
            --btn-hover-bg: #e2e8f0;      /* 按鈕懸停底色 */
            --title-color: #e11d48;       /* 標題粉紅/紅色 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        h1 {
            color: var(--title-color);
            margin-top: 0;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* 網格按鈕排版（每列 3 個，可隨寬度自由調整） */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .link-btn {
            background-color: var(--btn-bg);
            color: var(--accent-color);
            border: 1px solid #cbd5e1;
            padding: 15px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .link-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--accent-hover);
            border-color: #94a3b8;
            transform: translateY(-2px);
        }

        /* 訪客數數字樣式 */
        .counter {
            font-size: 3rem;
            font-weight: bold;
            color: #16a34a;
            margin: 10px 0 0 0;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標題區塊 -->
        <div class="card">
            <h1>🐅 歡迎來到 Little Ti9er 的小天地！</h1>
            <p>我的 GitHub Pages 網站已經成功建立囉！</p>
        </div>

        <!-- 頁面導航方格區塊 -->
        <div class="card">
            <h2 style="font-size: 1.2rem; color: var(--text-main); margin-top: 0; margin-bottom: 15px;">📂 快速導航</h2>
            <div class="link-grid">
                <a href="O.html" class="link-btn">O.html</a>
                <a href="trig.html" class="link-btn">trig.html</a>
                <a href="sine_game.html" class="link-btn">Sine Game</a> 
            </div>
        </div>

        <!-- 訪客數統計卡片 -->
        <div class="card">
            <p style="margin-bottom: 5px;">目前網站累積訪客數</p>
            <div id="visitor-box" class="loading">載入中...</div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwOTV7I2gfqjA2d-86EiC6Kptp5naH42qItMFaQBFHh59u_9_Lg1Fh6s68eHdoj-0Pu/exec?msg=visitors";

        async function fetchVisitorCount() {
            const box = document.getElementById('visitor-box');
            try {
                const response = await fetch(GAS_URL);
                
                if (!response.ok) {
                    throw new Error('網路回應錯誤：' + response.status);
                }

                const data = await response.json();
                
                if (data.status === "success") {
                    box.className = "counter";
                    box.innerText = data.visitors;
                } else {
                    box.innerText = "資料格式錯誤";
                }
            } catch (error) {
                console.error("發生錯誤：", error);
                box.className = "loading";
                box.innerText = "無法載入訪客數";
            }
        }

        fetchVisitorCount();
    </script>
    
</body>
</html>
